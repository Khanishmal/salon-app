include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Prefer const with constant constructors
    # Relaxed rules to reduce analyzer noise while developing.
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false

    # Style rules (set to false to avoid failing analysis on many files)
    use_key_in_widget_constructors: false
    avoid_print: false # Allow print for debugging
    prefer_final_fields: false
    prefer_final_locals: false

    # Keep some important null-safety and API rules enabled.
    always_declare_return_types: true
    always_use_package_imports: false
    avoid_init_to_null: true

# Suppress a number of noisy analyzer warnings for this repo so
# `flutter analyze` can be used as a fast check without failing on
# widespread style/warnings. These are temporary - it's better to
# fix them file-by-file in follow-up work.
analyzer:
  errors:
    unused_import: ignore
    unused_field: ignore
    undefined_hidden_name: ignore
    deprecated_member_use: ignore
    sized_box_for_whitespace: ignore
    use_build_context_synchronously: ignore
    unnecessary_nullable_for_final_variable_declarations: ignore
    unused_local_variable: ignore
    todo: ignore