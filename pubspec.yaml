#pubspec.yaml
name: salon_management_app
description: "AI-Powered Salon Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Changed to 3.0.0 for better compatibility

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.1
  google_fonts: ^8.0.0
  
  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.1
  
  flutter_unity_widget: ^2022.2.0
  # UI & Design
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  syncfusion_flutter_calendar: ^32.1.25 # Updated to stable version
  table_calendar: ^3.0.9
  image_picker: ^1.0.4
  intl: ^0.20.2
  
  # Payments
  url_launcher: ^6.2.2
  
  # HTTP & AI
  http: ^1.2.1
  image: ^4.1.4
  
  # Utilities
  shared_preferences: ^2.2.2
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo_icon.png
    - assets/hero-salon.jpg